<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">SOC investigation automation pipeline</title>
  <desc id="d">Alert webhook to queue to a step runner executing a DAG of investigation steps (user_context, ip_history, host_activity, threat_intel, related_alerts) to an evidence bundle in JSON and Markdown to a case. Median end-to-end time 17 seconds.</desc>
  <defs>
    <style>
      .mono { font-family: IBM Plex Mono, ui-monospace, Menlo, monospace; }
      .lbl { font-family: IBM Plex Mono, ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 1.6px; fill: #7c8590; }
      .hdr { font-family: IBM Plex Mono, ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 2px; fill: #ffb547; font-weight: 600; }
      .ttl { font-family: IBM Plex Sans, system-ui, sans-serif; font-size: 15px; fill: #e7e9ec; font-weight: 600; }
      .sub { font-family: IBM Plex Mono, ui-monospace, Menlo, monospace; font-size: 11.5px; fill: #7c8590; }
      .node { font-family: IBM Plex Mono, ui-monospace, Menlo, monospace; font-size: 12px; fill: #e7e9ec; }
      .ann { font-family: IBM Plex Mono, ui-monospace, Menlo, monospace; font-size: 11px; fill: #6cd3ff; }
      .panel { fill: #14171b; stroke: #2d333c; stroke-width: 1.2; }
      .box { fill: #191d22; stroke: #2d333c; stroke-width: 1.4; }
      .flow { fill: none; stroke: #6cd3ff; stroke-width: 1.5; }
      .edge { fill: none; stroke: #7c8590; stroke-width: 1.3; }
      .reg { fill: none; stroke: #7c8590; stroke-width: 1.2; }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="#6cd3ff"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="#7c8590"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#0e1013"/>
  <rect width="1200" height="520" fill="url(#grid)"/>

  <path class="reg" d="M14 34V14H34 M1166 14H1186V34 M1186 486V506H1166 M34 506H14V486"/>
  <path class="reg" d="M600 8v12 M594 14h12" opacity="0.6"/>

  <text class="lbl" x="40" y="54">SOC ENGINE · INVESTIGATION AUTOMATION</text>
  <text class="lbl" x="1160" y="54" text-anchor="end">END-TO-END · MEDIAN 17s · P95 41s</text>

  <!-- Alert webhook -->
  <rect class="box" x="40" y="205" width="140" height="100" rx="6"/>
  <text class="lbl" x="56" y="228">INGEST</text>
  <text class="ttl" x="56" y="252">Alert webhook</text>
  <text class="sub" x="56" y="274">POST /v1/alerts</text>
  <text class="sub" x="56" y="292">splunk · edr</text>

  <!-- Queue -->
  <rect class="box" x="212" y="205" width="120" height="100" rx="6"/>
  <text class="lbl" x="228" y="228">BUFFER</text>
  <text class="ttl" x="228" y="252">Queue</text>
  <g fill="none" stroke="#6cd3ff" stroke-width="1.2">
    <rect x="228" y="266" width="14" height="14" rx="2" fill="rgba(108,211,255,0.18)"/>
    <rect x="246" y="266" width="14" height="14" rx="2" fill="rgba(108,211,255,0.18)"/>
    <rect x="264" y="266" width="14" height="14" rx="2" fill="rgba(108,211,255,0.18)"/>
    <rect x="282" y="266" width="14" height="14" rx="2" stroke="#2d333c"/>
    <rect x="300" y="266" width="14" height="14" rx="2" stroke="#2d333c"/>
  </g>
  <text class="sub" x="228" y="296">depth 3 · fifo</text>

  <path class="flow" d="M180 255H209" marker-end="url(#arr)"/>
  <text class="ann" x="196" y="243" text-anchor="middle">40ms</text>
  <path class="flow" d="M332 255H359" marker-end="url(#arr)"/>
  <text class="ann" x="346" y="243" text-anchor="middle">&lt;1s</text>

  <!-- Step runner -->
  <rect class="panel" x="362" y="90" width="486" height="330" rx="6"/>
  <text class="hdr" x="380" y="117">STEP RUNNER · DAG</text>
  <text class="ann" x="830" y="117" text-anchor="end">median 14s</text>
  <line x1="380" y1="130" x2="830" y2="130" stroke="#2d333c" stroke-width="1.2"/>

  <!-- DAG edges -->
  <path class="edge" d="M502 168H543" marker-end="url(#arrm)"/>
  <path class="edge" d="M502 248H543" marker-end="url(#arrm)"/>
  <path class="edge" d="M668 168H690V202H705" marker-end="url(#arrm)"/>
  <path class="edge" d="M668 248H690V214H705" marker-end="url(#arrm)"/>

  <!-- DAG nodes -->
  <rect x="380" y="148" width="122" height="40" rx="6" fill="#191d22" stroke="#3ddc97" stroke-width="1.4"/>
  <circle cx="394" cy="168" r="3.5" fill="#3ddc97"/>
  <text class="node" x="404" y="172">user_context</text>

  <rect x="380" y="228" width="122" height="40" rx="6" fill="#191d22" stroke="#3ddc97" stroke-width="1.4"/>
  <circle cx="394" cy="248" r="3.5" fill="#3ddc97"/>
  <text class="node" x="404" y="252">ip_history</text>

  <rect x="546" y="148" width="122" height="40" rx="6" fill="#191d22" stroke="#6cd3ff" stroke-width="1.4"/>
  <circle cx="560" cy="168" r="3.5" fill="#6cd3ff"/>
  <text class="node" x="570" y="172">host_activity</text>

  <rect x="546" y="228" width="122" height="40" rx="6" fill="#191d22" stroke="#6cd3ff" stroke-width="1.4"/>
  <circle cx="560" cy="248" r="3.5" fill="#6cd3ff"/>
  <text class="node" x="570" y="252">threat_intel</text>

  <rect x="708" y="188" width="130" height="40" rx="6" fill="#191d22" stroke="#2d333c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="721" cy="208" r="3.5" fill="none" stroke="#7c8590" stroke-width="1.2"/>
  <text class="node" x="730" y="212" fill="#7c8590">related_alerts</text>

  <!-- stage labels -->
  <text class="lbl" x="441" y="290" text-anchor="middle">STAGE 1</text>
  <text class="lbl" x="607" y="290" text-anchor="middle">STAGE 2</text>
  <text class="lbl" x="773" y="250" text-anchor="middle">JOIN</text>

  <!-- mini timeline -->
  <line x1="380" y1="304" x2="830" y2="304" stroke="#2d333c" stroke-width="1"/>
  <text class="lbl" x="380" y="324">TIMELINE</text>
  <g class="mono" font-size="11" fill="#7c8590" text-anchor="middle">
    <text x="480" y="324">0</text><text x="580" y="324">5</text><text x="680" y="324">10</text><text x="780" y="324">15s</text>
  </g>
  <g stroke="#2d333c" stroke-width="1">
    <line x1="480" y1="330" x2="480" y2="404"/><line x1="580" y1="330" x2="580" y2="404"/>
    <line x1="680" y1="330" x2="680" y2="404"/><line x1="780" y1="330" x2="780" y2="404"/>
  </g>
  <text class="sub" x="380" y="348">lane A</text>
  <rect x="480" y="339" width="60" height="12" rx="2" fill="#3ddc97" opacity="0.85"/>
  <rect x="542" y="339" width="118" height="12" rx="2" fill="#6cd3ff" opacity="0.85"/>
  <text class="sub" x="380" y="370">lane B</text>
  <rect x="480" y="361" width="40" height="12" rx="2" fill="#3ddc97" opacity="0.85"/>
  <rect x="522" y="361" width="178" height="12" rx="2" fill="#6cd3ff" opacity="0.85"/>
  <text class="sub" x="380" y="392">join</text>
  <rect x="702" y="383" width="60" height="12" rx="2" fill="none" stroke="#7c8590" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- runner -> evidence -->
  <path class="flow" d="M848 255H877" marker-end="url(#arr)"/>
  <text class="ann" x="863" y="243" text-anchor="middle">+2s</text>

  <!-- Evidence bundle -->
  <rect class="box" x="880" y="185" width="148" height="140" rx="6"/>
  <text class="lbl" x="896" y="208">OUTPUT</text>
  <text class="ttl" x="896" y="232">Evidence bundle</text>
  <rect x="896" y="246" width="116" height="24" rx="4" fill="#0e1013" stroke="#2d333c" stroke-width="1.2"/>
  <text class="mono" x="908" y="262" font-size="11.5" fill="#6cd3ff">bundle.json</text>
  <rect x="896" y="276" width="116" height="24" rx="4" fill="#0e1013" stroke="#2d333c" stroke-width="1.2"/>
  <text class="mono" x="908" y="292" font-size="11.5" fill="#ffb547">summary.md</text>
  <text class="sub" x="896" y="316">sha256 sealed</text>

  <path class="flow" d="M1028 255H1053" marker-end="url(#arr)"/>

  <!-- Case -->
  <rect x="1056" y="205" width="104" height="100" rx="6" fill="#191d22" stroke="#ffb547" stroke-width="1.4"/>
  <text class="lbl" x="1072" y="228">TICKET</text>
  <text class="ttl" x="1072" y="252">Case</text>
  <text class="sub" x="1072" y="274">SOC-4821</text>
  <text class="mono" x="1072" y="292" font-size="11.5" fill="#ffb547">sev: high</text>

  <!-- legend -->
  <g transform="translate(40 446)">
    <circle cx="5" cy="-4" r="3.5" fill="#3ddc97"/><text class="lbl" x="16" y="0">DONE</text>
    <circle cx="85" cy="-4" r="3.5" fill="#6cd3ff"/><text class="lbl" x="96" y="0">RUNNING</text>
    <circle cx="190" cy="-4" r="3.5" fill="none" stroke="#7c8590" stroke-width="1.2"/><text class="lbl" x="201" y="0">PENDING</text>
    <text class="lbl" x="300" y="0">· IDEMPOTENT STEPS · 30s PER-STEP TIMEOUT · RETRY W/ BACKOFF</text>
  </g>

  <line x1="40" y1="468" x2="1160" y2="468" stroke="#2d333c" stroke-width="1"/>
  <text class="lbl" x="40" y="492">FIG. SOC-001 — INVESTIGATION PIPELINE</text>
  <text class="lbl" x="1160" y="492" text-anchor="end">HEXWORKS · APPLIED CYBER R&amp;D</text>
</svg>
