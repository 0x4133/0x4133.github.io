<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">ESP32-C6 wireless security sensor architecture</title>
  <desc id="d">Three layers: radio capture (Wi-Fi promiscuous management frames, BLE passive scan), baseline engine (fingerprint reducer, NVS room baseline, diff to events), and telemetry (MQTT over mTLS to broker to Splunk HEC to SOC).</desc>
  <defs>
    <style>
      .mono { font-family: IBM Plex Mono, ui-monospace, Menlo, monospace; }
      .sans { font-family: IBM Plex Sans, system-ui, sans-serif; }
      .lbl { font-family: IBM Plex Mono, ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 1.6px; fill: #7c8590; }
      .hdr { font-family: IBM Plex Mono, ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 2px; fill: #ffb547; font-weight: 600; }
      .ttl { font-family: IBM Plex Sans, system-ui, sans-serif; font-size: 15px; fill: #e7e9ec; font-weight: 600; }
      .sub { font-family: IBM Plex Mono, ui-monospace, Menlo, monospace; font-size: 11.5px; fill: #7c8590; }
      .panel { fill: #14171b; stroke: #2d333c; stroke-width: 1.2; }
      .box { fill: #191d22; stroke: #2d333c; stroke-width: 1.4; }
      .tag { fill: #0e1013; stroke: #2d333c; stroke-width: 1.2; }
      .tagt { font-family: IBM Plex Mono, ui-monospace, Menlo, monospace; font-size: 11.5px; fill: #6cd3ff; }
      .flow { fill: none; stroke: #6cd3ff; stroke-width: 1.5; }
      .reg { fill: none; stroke: #7c8590; stroke-width: 1.2; }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="#6cd3ff"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="#7c8590"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#0e1013"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- registration marks -->
  <path class="reg" d="M14 34V14H34 M1166 14H1186V34 M1186 566V586H1166 M34 586H14V566"/>
  <path class="reg" d="M600 8v12 M594 14h12 M600 580v12 M594 586h12" opacity="0.6"/>

  <!-- title strip -->
  <text class="lbl" x="40" y="54">ESP32-C6 · WIRELESS SECURITY SENSOR</text>
  <text class="lbl" x="1160" y="54" text-anchor="end">NODE lab-ceiling-02 · REV B</text>

  <!-- ===== Layer 1: RADIO CAPTURE ===== -->
  <rect class="panel" x="40" y="76" width="340" height="364" rx="6"/>
  <text class="hdr" x="60" y="104">01 · RADIO CAPTURE</text>
  <line x1="60" y1="118" x2="360" y2="118" stroke="#2d333c" stroke-width="1.2"/>

  <rect class="box" x="60" y="140" width="300" height="100" rx="6"/>
  <circle cx="80" cy="166" r="4" fill="#6cd3ff"/>
  <text class="ttl" x="94" y="171">Wi-Fi promiscuous</text>
  <text class="sub" x="80" y="196">mgmt frames only</text>
  <text class="sub" x="80" y="216">beacon · probe · auth · deauth</text>

  <rect class="box" x="60" y="262" width="300" height="100" rx="6"/>
  <circle cx="80" cy="288" r="4" fill="#6cd3ff"/>
  <text class="ttl" x="94" y="293">BLE passive scan</text>
  <text class="sub" x="80" y="318">adv PDUs · MAC · RSSI</text>
  <text class="sub" x="80" y="338">no scan requests transmitted</text>

  <rect x="60" y="386" width="300" height="34" rx="6" fill="none" stroke="#2d333c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text class="lbl" x="210" y="407" text-anchor="middle">RISC-V · 802.11ax · BLE 5</text>

  <!-- ===== Layer 2: BASELINE ENGINE ===== -->
  <rect class="panel" x="430" y="76" width="340" height="364" rx="6"/>
  <text class="hdr" x="450" y="104">02 · BASELINE ENGINE</text>
  <line x1="450" y1="118" x2="750" y2="118" stroke="#2d333c" stroke-width="1.2"/>

  <rect class="box" x="450" y="140" width="300" height="118" rx="6"/>
  <text class="ttl" x="466" y="166">Fingerprint reducer</text>
  <rect class="tag" x="466" y="180" width="130" height="26" rx="4"/>
  <text class="tagt" x="531" y="197" text-anchor="middle">BSSID / OUI</text>
  <rect class="tag" x="604" y="180" width="130" height="26" rx="4"/>
  <text class="tagt" x="669" y="197" text-anchor="middle">SSID hash</text>
  <rect class="tag" x="466" y="214" width="130" height="26" rx="4"/>
  <text class="tagt" x="531" y="231" text-anchor="middle">channel</text>
  <rect class="tag" x="604" y="214" width="130" height="26" rx="4"/>
  <text class="tagt" x="669" y="231" text-anchor="middle">RSSI bucket</text>

  <rect class="box" x="450" y="282" width="300" height="56" rx="6"/>
  <text class="ttl" x="466" y="305">NVS room baseline</text>
  <text class="sub" x="466" y="325">learned over 24 h · flash-persisted</text>

  <rect x="450" y="362" width="300" height="58" rx="6" fill="#191d22" stroke="#ffb547" stroke-width="1.4"/>
  <text class="ttl" x="466" y="386">diff → events</text>
  <text class="sub" x="466" y="406">new · missing · moved · spoofed</text>

  <path class="flow" d="M600 258V279" marker-end="url(#arr)"/>
  <path class="flow" d="M600 338V359" marker-end="url(#arr)"/>

  <!-- ===== Layer 3: TELEMETRY ===== -->
  <rect class="panel" x="820" y="76" width="340" height="364" rx="6"/>
  <text class="hdr" x="840" y="104">03 · TELEMETRY</text>
  <line x1="840" y1="118" x2="1140" y2="118" stroke="#2d333c" stroke-width="1.2"/>

  <rect class="box" x="840" y="140" width="300" height="56" rx="6"/>
  <text class="ttl" x="856" y="163">MQTT over mTLS</text>
  <text class="sub" x="856" y="183">QoS 1 · per-node client cert</text>

  <rect class="box" x="840" y="218" width="300" height="56" rx="6"/>
  <text class="ttl" x="856" y="241">Broker</text>
  <text class="sub" x="856" y="261">topic sensors/+/events</text>

  <rect class="box" x="840" y="296" width="300" height="56" rx="6"/>
  <text class="ttl" x="856" y="319">Splunk HEC</text>
  <text class="sub" x="856" y="339">index=wireless st=esp32:evt</text>

  <rect x="840" y="374" width="300" height="46" rx="6" fill="#191d22" stroke="#3ddc97" stroke-width="1.4"/>
  <circle cx="860" cy="397" r="4" fill="#3ddc97"/>
  <text class="ttl" x="874" y="402">SOC</text>
  <text class="sub" x="1124" y="401" text-anchor="end">correlation → notable</text>

  <path class="flow" d="M990 196V215" marker-end="url(#arr)"/>
  <path class="flow" d="M990 274V293" marker-end="url(#arr)"/>
  <path class="flow" d="M990 352V371" marker-end="url(#arr)"/>

  <!-- ===== cross-layer flows ===== -->
  <path class="flow" d="M360 190H405V196H447" marker-end="url(#arr)"/>
  <path class="flow" d="M360 312H405V196"/>
  <circle cx="405" cy="196" r="3" fill="#6cd3ff"/>
  <path class="flow" d="M750 391H795V168H837" marker-end="url(#arr)"/>

  <!-- ===== event example ===== -->
  <path d="M600 420V466" fill="none" stroke="#7c8590" stroke-width="1.2" stroke-dasharray="3 4" marker-end="url(#arrm)"/>
  <rect x="40" y="470" width="760" height="64" rx="6" fill="#14171b" stroke="#2d333c" stroke-width="1.2"/>
  <text class="lbl" x="60" y="493">EXAMPLE EVENT · sensors/lab-ceiling-02/events</text>
  <text class="mono" x="60" y="519" font-size="14"><tspan fill="#7c8590">{</tspan><tspan fill="#6cd3ff">"type"</tspan><tspan fill="#7c8590">:</tspan><tspan fill="#ffb547">"wifi.new_bssid"</tspan><tspan fill="#7c8590">,</tspan><tspan fill="#6cd3ff">"rssi"</tspan><tspan fill="#7c8590">:</tspan><tspan fill="#e7e9ec">-48</tspan><tspan fill="#7c8590">,</tspan><tspan fill="#6cd3ff">"ch"</tspan><tspan fill="#7c8590">:</tspan><tspan fill="#e7e9ec">6</tspan><tspan fill="#7c8590">}</tspan></text>

  <!-- legend -->
  <line x1="830" y1="489" x2="860" y2="489" stroke="#6cd3ff" stroke-width="1.5"/>
  <text class="lbl" x="870" y="493">DATA PATH</text>
  <line x1="830" y1="515" x2="860" y2="515" stroke="#7c8590" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text class="lbl" x="870" y="519">PAYLOAD SAMPLE</text>

  <!-- caption -->
  <line x1="40" y1="556" x2="1160" y2="556" stroke="#2d333c" stroke-width="1"/>
  <text class="lbl" x="40" y="576">FIG. ESP-001 — SENSOR ARCHITECTURE</text>
  <text class="lbl" x="1160" y="576" text-anchor="end">HEXWORKS · APPLIED CYBER R&amp;D</text>
</svg>
