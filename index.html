<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops Timeline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Ops Timeline</h1>
    <div class="topbar-actions">
      <label class="toggle"><input type="checkbox" id="utcToggle"> UTC</label>
      <label class="toggle"><input type="checkbox" id="newestFirst"> Newest first</label>
      <button type="button" id="exportMd" title="Export the entries currently shown as Markdown">Export .md</button>
      <button type="button" id="exportJson" title="Download a full JSON backup">Backup .json</button>
      <button type="button" id="importBtn" title="Merge a JSON backup into this timeline">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button type="button" id="clearAll" class="danger">Clear all</button>
    </div>
  </header>

  <main>
    <section class="composer">
      <form id="noteForm">
        <textarea id="noteText" rows="3" autofocus
          placeholder="What happened? Start with a time (14:32 or 1432) to backdate. Ctrl+Enter to add."></textarea>
        <div class="composer-row">
          <select id="noteTag" title="Category"></select>
          <input type="datetime-local" id="noteTime" title="Override the timestamp (local time). Leave blank to use now or the note's time prefix.">
          <span class="spacer"></span>
          <button type="submit" class="primary">Add entry</button>
        </div>
        <div id="tsPreview" class="hint" aria-live="polite"></div>
      </form>
    </section>

    <section class="filters">
      <input type="search" id="search" placeholder="Search entries…">
      <select id="filterTag"><option value="">All tags</option></select>
      <input type="date" id="filterDay" title="Show a single day">
      <button type="button" id="clearFilters">Reset</button>
      <span id="count" class="muted"></span>
    </section>

    <section id="timeline" class="timeline" aria-live="polite"></section>
  </main>

  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
